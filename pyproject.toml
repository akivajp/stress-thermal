[project]
name = "stress-thermal"
version = "0.1.0"
description = "ストレステストを流しながら CPU / GPU / SSD などの温度・電力を記録するツール"
readme = "README.ja.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "rich>=14.0",
]

[project.optional-dependencies]
# GPU 負荷 (scripts/gpu_load.py) 用
gpu = ["torch>=2.5"]

[project.scripts]
stress-thermal = "stress_thermal.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stress_thermal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
