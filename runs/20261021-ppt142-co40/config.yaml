interval: 1.0
grace: 60
cpu_temp_limit: 85
scratch_dir: ~/.cache/stress-thermal
notes: 'BIOS (2026-10-21 12:13〜): ECO モード 105W / PBO Advanced, PBO Limits Manual (PPT
  142W / TDC 110A / EDC 170A) / Curve Optimizer 全コア -40 / 温度上限 85℃ (前回から変更なしの前提)

  BIOS (2026-10-21 午前): ECO モード 105W / Curve Optimizer 全コア -40 / 温度上限 (Tjmax) 85℃
  (前回から変更なしの前提)

  BIOS (2026-10-20): TDP 105W 制限 / PBO 有効 / 温度上限 (Tjmax) 85℃ / Curve Optimizer 全コア
  -30

  '
phases:
- name: idle-start
  duration: 300
- name: cpu-all
  duration: 1800
  commands:
  - stress-ng --cpu 16 --cpu-method all --verify --matrix 16 --timeout {duration}s
    --metrics-brief
- name: cpu-per-core
  per_core: 180
  command: taskset -c {cpu} stress-ng --cpu 1 --cpu-method all --verify --timeout
    {duration}s --metrics-brief
- name: idle-end
  duration: 300
scale: 1.0
