# ストレステストのフェーズ定義。
# commands はフェーズ開始時に並列で起動し、duration 秒で自ら終わる前提 (超えたら grace 秒後に止める)。
# プレースホルダ: {duration} = フェーズの秒数, {cpu} = per_core の対象 CPU, {scratch} = scratch_dir, {nproc} = 論理 CPU 数
# コマンドはリポジトリのルートを作業ディレクトリとして実行される。

interval: 1.0                       # センサーのサンプリング間隔 [秒]
grace: 60                           # コマンドが duration を超えて動いているときの猶予 [秒]
cpu_temp_limit: 85                  # BIOS で設定した CPU の温度上限 (Tctl) [℃]。上限付近にいた割合の集計に使う
scratch_dir: ~/.cache/stress-thermal  # SSD 負荷用のファイル置き場 (初回に 32GiB 書き込む)

notes: |
  BIOS (2026-10-21 23:10頃〜): Performance Preset 自動 / PBO Limits Manual (PPT 162W / TDC 120A / EDC 180A) / Curve Optimizer CCD0 (3D V-Cache) -25 / CCD1 -30 / 温度上限 85℃
  BIOS (2026-10-21 13:16頃〜): Performance Preset 自動 / PBO Limits Manual (PPT 142W / TDC 110A / EDC 170A) / Curve Optimizer -20 (PBO の項目) / 温度上限 85℃。CO -40 (PBO の項目) は 13:10 に cpu2 の単コア負荷中にフリーズしたため
  BIOS (2026-10-21 12:30頃〜): Performance Preset を「自動」に戻し、PBO Limits Manual (PPT 142W / TDC 110A / EDC 170A)・Curve Optimizer -40・温度上限 85℃ をプリセット以外の項目で設定
  BIOS (2026-10-21 12:13〜): ECO モード 105W / PBO Advanced, PBO Limits Manual (PPT 142W / TDC 110A / EDC 170A) / Curve Optimizer 全コア -40 / 温度上限 85℃ (前回から変更なしの前提)
  BIOS (2026-10-21 午前): ECO モード 105W / Curve Optimizer 全コア -40 / 温度上限 (Tjmax) 85℃ (前回から変更なしの前提)
  BIOS (2026-10-20): TDP 105W 制限 / PBO 有効 / 温度上限 (Tjmax) 85℃ / Curve Optimizer 全コア -30

phases:
  - name: idle-start
    duration: 300

  # 全コア: stress-ng の CPU 演算 (結果を検証する) と行列演算を半々で
  - name: cpu-all
    duration: 1800
    commands:
      - stress-ng --cpu 16 --cpu-method all --verify --matrix 16 --timeout {duration}s --metrics-brief

  # 1物理コアずつ単スレッド負荷。Curve Optimizer の負方向オフセットは、
  # 単コアで最高クロックまで上がる軽負荷のときに不安定になりやすいため
  - name: cpu-per-core
    per_core: 180
    command: taskset -c {cpu} stress-ng --cpu 1 --cpu-method all --verify --timeout {duration}s --metrics-brief

  # CPU + GPU 2枚 + SSD (RAID0 の連続読み込み) を同時に。筐体内の発熱が最大になる状態
  - name: combined
    duration: 1800
    commands:
      - stress-ng --cpu 16 --cpu-method all --verify --matrix 16 --timeout {duration}s --metrics-brief
      - uv run --extra gpu python scripts/gpu_load.py --device 0 --duration {duration}
      - uv run --extra gpu python scripts/gpu_load.py --device 1 --duration {duration}
      - fio --name=ssd --filename={scratch}/fio.dat --size=8G --offset_increment=8G --numjobs=4 --rw=read --bs=1M --iodepth=32 --ioengine=io_uring --direct=1 --time_based --runtime={duration} --group_reporting

  - name: idle-end
    duration: 300
